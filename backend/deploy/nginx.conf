# Nginx cho reMini — AlmaLinux 9.
# Cài:  sudo cp deploy/nginx.conf /etc/nginx/conf.d/remini.conf   (sửa tên miền ở 2 chỗ server_name)
#       sudo nginx -t && sudo systemctl reload nginx
# File này chỉ có cổng 80. Sau đó chạy `certbot --nginx -d recloud.vn -d www.recloud.vn -d api.recloud.vn`
# — certbot tự thêm khối 443 + chứng chỉ + chuyển hướng http→https vào chính file này.
#
# Mặc định: web quản trị  https://recloud.vn      → /var/www/remini-web (frontend/dist)
#           API           https://api.recloud.vn  → Node 127.0.0.1:4000 (PM2)

# ───────── Dùng chung (conf.d nằm trong khối http) ─────────
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
# Ảnh (jpg/png/webp) đã nén sẵn — không gzip lại
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# Bộ nhớ đệm cho ảnh công khai /uploads (tên file có timestamp + chuỗi ngẫu nhiên nên không bao giờ bị ghi đè)
proxy_cache_path /var/cache/nginx/remini_uploads levels=1:2 keys_zone=remini_uploads:10m max_size=1g inactive=7d use_temp_path=off;

upstream remini_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# ───────── API ─────────
server {
    listen 80;
    listen [::]:80;
    server_name api.recloud.vn;

    # Tải ảnh lên: multer giới hạn 10MB / ảnh, album tối đa 30 ảnh / lần. Nginx chặn ở 50MB / request —
    # giao diện nên chia lô ≤ ~45MB mỗi request (lỗi 413 từ Nginx không có JSON body).
    client_max_body_size 50m;
    client_body_buffer_size 1m;

    # Nén ảnh bằng sharp có thể mất vài chục giây khi tải nhiều ảnh
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx NỐI THÊM IP máy gọi vào cuối → backend đặt TRUST_PROXY=1 sẽ lấy đúng IP thật, client không giả được
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ảnh công khai (logo, banner, sản phẩm): cache ở Nginx + trình duyệt.
    # Ảnh album riêng tư ở /api/album-photos/... (URL ký, hết hạn) KHÔNG đi qua đây và không được cache.
    location /uploads/ {
        proxy_pass http://remini_api;
        proxy_cache remini_uploads;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        # Express đặt Cache-Control: max-age=0 → bỏ qua để Nginx tự cache; trình duyệt dùng header bên dưới
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Cache-Status $upstream_cache_status;
        # Xoá ảnh trong shop → bản đã cache còn hiện tối đa 7 ngày; muốn xoá ngay: rm -rf /var/cache/nginx/remini_uploads/*
    }

    location / {
        proxy_pass http://remini_api;
    }
}

# ───────── Web quản trị (SPA Vite) ─────────
server {
    listen 80;
    listen [::]:80;
    server_name recloud.vn www.recloud.vn;

    root /var/www/remini-web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File build của Vite có hash trong tên → cache 1 năm
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html không cache để lần deploy sau có hiệu lực ngay
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router: mọi đường dẫn khác trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
